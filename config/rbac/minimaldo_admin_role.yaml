# This rule is not used by the project homelab-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over application.homelab.nishantlabs.cloud.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: homelab-operator
    app.kubernetes.io/managed-by: kustomize
  name: minimaldo-admin-role
rules:
- apiGroups:
  - application.homelab.nishantlabs.cloud
  resources:
  - minimaldoes
  verbs:
  - '*'
- apiGroups:
  - application.homelab.nishantlabs.cloud
  resources:
  - minimaldoes/status
  verbs:
  - get
